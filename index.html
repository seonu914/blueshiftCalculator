<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> 30412 박선우 </title>
    <script src="index.js" defer> </script>
</head>
<body>

<!-- 본래 주파수 계산 -->
<div>
    <label>
        <input id="velocity" placeholder="velocity (% of c)">
        <input id="obs_frequency" placeholder="observed freq (THz)">
    </label>
    <button id="calc_origin_freq" onclick="
    let res = calc_origin_freq(
        document.getElementById('velocity').value,
        document.getElementById('obs_frequency').value
    )
    document.getElementById('htag').innerHTML = res.toFixed(6) + 'THz'
">calculate original freq</button>
</div>

<hr>

<!-- 본래 속도 계산 -->
<div>
    <label>
        <input id="s_frequency" placeholder="original freq (THz)">
        <input id="obs_frequency1" placeholder="observed freq (THz)">
    </label>
    <button id="calc_speed" onclick="
    let res = calc_speed(
        document.getElementById('s_frequency').value,
        document.getElementById('obs_frequency1').value
    )
    document.getElementById('htag').innerHTML = res
">calculate speed of source</button>
</div>

<hr>

<!-- 관측되는 주파수 계산 -->
<div>
    <label>
        <input id="s_frequency1" placeholder="original freq (THz)">
        <input id="velocity1" placeholder="velocity (% of c)">
    </label>
    <button id="calc_obs_freq" onclick="
    let res = calc_shifted_freq(
            document.getElementById('s_frequency1').value,
            document.getElementById('velocity1').value
            )
    document.getElementById('htag').innerHTML = res.toFixed(6) + 'THz'
    ">calculate observed frequency</button>
</div>

<hr>

<!-- 적색편이 수치 계산 -->
<div>
    <label>
        <input id="original_frequency" placeholder="original freq (THz)">
        <input id="observed_frequency" placeholder="observed freq (THz)">
    </label>
    <button id="calc_z" onclick="
        let res = calc_z(
            document.getElementById('original_frequency').value,
            document.getElementById('observed_frequency').value
        )
        document.getElementById('htag').innerHTML = 'z = ' + res
    ">calculate observed frequency</button>
</div>

<div>
    <h1 id="htag">TEST</h1>
</div>

<div>
    <img src="visible-light-spectrum.jpg" alt="pyo.svg">
</div>

</body>
</html>
